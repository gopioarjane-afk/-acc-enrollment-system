<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - ACC Enrollment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-circle">ACC</div>
        <h2 class="fw-bold mt-3">Enrollment System</h2>
        <p class="text-muted">Account Enrollment Portal</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control form-control-lg" name="username" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" name="password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100">Login</button>
    </form>

    <div class="demo-box mt-4">
        <strong>Default Super Admin</strong><br>
        Username: <code>superadmin</code><br>
        Password: <code>SuperAdmin123!</code>
    </div>
</div>
</body>
</html>
