{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}

<div class="page-header">
    <h2>My Profile</h2>

    <p class="text-muted mb-0">
        View and update your student information.
    </p>
</div>


<div class="profile-card">

    <form method="POST">

        <div class="row g-3">

            <!-- STUDENT ID -->
            <div class="col-md-6">

                <label class="form-label">
                    Student ID
                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ student.student_id }}"
                    readonly>

            </div>


            <!-- USERNAME -->
            <div class="col-md-6">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    value="{{ student.username }}"
                    readonly>

            </div>


            <!-- FIRST NAME -->
            <div class="col-md-4">

                <label class="form-label">
                    First Name
                </label>

                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    value="{{ student.first_name }}"
                    required>

            </div>


            <!-- MIDDLE NAME -->
            <div class="col-md-4">

                <label class="form-label">
                    Middle Name
                </label>

                <input
                    type="text"
                    name="middle_name"
                    class="form-control"
                    value="{{ student.middle_name or '' }}">

            </div>


            <!-- LAST NAME -->
            <div class="col-md-4">

                <label class="form-label">
                    Last Name
                </label>

                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                    value="{{ student.last_name }}"
                    required>

            </div>


            <!-- BIRTHDATE -->
            <div class="col-md-4">

                <label class="form-label">
                    Birthdate
                </label>

                <input
                    type="date"
                    name="birthdate"
                    class="form-control"
                    value="{{ student.birthdate or '' }}">

            </div>


            <!-- GENDER -->
            <div class="col-md-4">

                <label class="form-label">
                    Gender
                </label>

                <select
                    name="gender"
                    class="form-select">

                    <option value="">
                        Select Gender
                    </option>

                    <option
                        value="Male"
                        {% if student.gender == "Male" %}selected{% endif %}>
                        Male
                    </option>

                    <option
                        value="Female"
                        {% if student.gender == "Female" %}selected{% endif %}>
                        Female
                    </option>

                </select>

            </div>


            <!-- PHONE -->
            <div class="col-md-4">

                <label class="form-label">
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    class="form-control"
                    value="{{ student.phone or '' }}"
                    placeholder="09XXXXXXXXX">

            </div>


            <!-- EMAIL -->
            <div class="col-md-6">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ student.email or '' }}"
                    placeholder="example@email.com">

            </div>


            <!-- ADDRESS -->
            <div class="col-md-6">

                <label class="form-label">
                    Address
                </label>

                <input
                    type="text"
                    name="address"
                    class="form-control"
                    value="{{ student.address or '' }}"
                    placeholder="Complete Address">

            </div>


            <!-- SAVE BUTTON -->
            <div class="col-12 mt-4">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Changes

                </button>

                <a
                    href="{{ url_for('student.dashboard') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </div>

    </form>

</div>

{% endblock %}
