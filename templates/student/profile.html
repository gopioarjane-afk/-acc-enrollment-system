{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h2 class="fw-bold mb-4">My Student Profile</h2>
{% if not student %}
<div class="alert alert-info">Your student record is being initialized. Ask an administrator to create your student account.</div>
{% else %}
<form method="POST">
<div class="card shadow-sm mb-4"><div class="card-body">
<h5>Account</h5>
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Username</label><input class="form-control" value="{{ student.username }}" disabled></div>
<div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ student.email or '' }}"></div>
</div>
</div></div>
<div class="card shadow-sm"><div class="card-body">
<h5>Personal Information</h5>
<div class="row g-3">
<div class="col-md-4"><label class="form-label">First Name</label><input name="first_name" class="form-control" value="{{ student.first_name }}" required></div>
<div class="col-md-4"><label class="form-label">Middle Name</label><input name="middle_name" class="form-control" value="{{ student.middle_name or '' }}"></div>
<div class="col-md-4"><label class="form-label">Last Name</label><input name="last_name" class="form-control" value="{{ student.last_name }}" required></div>
<div class="col-md-4"><label class="form-label">Birth Date</label><input type="date" name="birth_date" class="form-control" value="{{ student.birth_date or '' }}"></div>
<div class="col-md-4"><label class="form-label">Sex</label><select name="sex" class="form-select"><option value="">Select</option><option {% if student.sex=='Male' %}selected{% endif %}>Male</option><option {% if student.sex=='Female' %}selected{% endif %}>Female</option></select></div>
<div class="col-md-4"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ student.phone or '' }}"></div>
<div class="col-md-6"><label class="form-label">Course / Program</label><input name="course" class="form-control" value="{{ student.course or '' }}"></div>
<div class="col-md-6"><label class="form-label">Year Level</label><select name="year_level" class="form-select"><option value="">Select</option>{% for y in ['1st Year','2nd Year','3rd Year','4th Year','5th Year'] %}<option {% if student.year_level==y %}selected{% endif %}>{{ y }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="3">{{ student.address or '' }}</textarea></div>
</div>
</div></div>
<button class="btn btn-primary mt-4">Save Profile</button>
</form>
{% endif %}
{% endblock %}
